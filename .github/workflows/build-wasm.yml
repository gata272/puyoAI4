name: Build WASM and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Check Emscripten
        run: emcc --version

      - name: Native smoke test
        run: |
          g++ \
            -std=c++20 \
            -O2 \
            tests/test_native.cpp \
            ai/ai.cpp \
            ai/gtr/gtr_ai.cpp \
            ai/search/move_generator.cpp \
            ai/search/beam_search.cpp \
            ai/simulation/board.cpp \
            ai/simulation/simulator.cpp \
            ai/evaluation/features.cpp \
            ai/evaluation/evaluation.cpp \
            ai/evaluation/weights.cpp \
            ai/evaluation/trigger_route.cpp \
            ai/evaluation/virtual_chain_potential.cpp \
            ai/evaluation/long_chain_potential.cpp \
            ai/evaluation/main_chain.cpp \
            ai/evaluation/forms.cpp \
            ai/evaluation/debug_log.cpp \
            ai/evaluation/survival_horizon.cpp \
            -I. \
            -o native_test

          ./native_test

      - name: Trigger-structure regression test
        run: |
          g++ \
            -std=c++20 \
            -O2 \
            tests/test_trigger_structure.cpp \
            ai/evaluation/trigger_route.cpp \
            ai/evaluation/virtual_chain_potential.cpp \
            ai/evaluation/long_chain_potential.cpp \
            ai/evaluation/main_chain.cpp \
            ai/evaluation/features.cpp \
            ai/evaluation/forms.cpp \
            ai/simulation/board.cpp \
            ai/simulation/simulator.cpp \
            -I. \
            -o trigger_structure_test

          ./trigger_structure_test

      - name: Virtual-chain potential regression test
        run: |
          g++ \
            -std=c++20 \
            -O2 \
            tests/test_virtual_chain_potential.cpp \
            ai/evaluation/virtual_chain_potential.cpp \
            ai/search/move_generator.cpp \
            ai/simulation/board.cpp \
            ai/simulation/simulator.cpp \
            -I. \
            -o virtual_chain_potential_test

          ./virtual_chain_potential_test

      - name: Main-chain policy regression test
        run: |
          g++ \
            -std=c++20 \
            -O2 \
            tests/test_main_chain.cpp \
            ai/evaluation/main_chain.cpp \
            ai/simulation/board.cpp \
            -I. \
            -o main_chain_test

          ./main_chain_test

      - name: Weight API regression test
        run: |
          g++ \
            -std=c++20 \
            -O2 \
            tests/test_weight_api.cpp \
            ai/evaluation/weights.cpp \
            -I. \
            -o weight_api_test

          ./weight_api_test

      - name: Chain benchmark regression test
        run: |
          g++ \
            -std=c++20 \
            -O2 \
            tests/test_chain_benchmark.cpp \
            ai/benchmark/chain_benchmark.cpp \
            ai/ai.cpp \
            ai/gtr/gtr_ai.cpp \
            ai/search/move_generator.cpp \
            ai/search/beam_search.cpp \
            ai/simulation/board.cpp \
            ai/simulation/simulator.cpp \
            ai/evaluation/features.cpp \
            ai/evaluation/evaluation.cpp \
            ai/evaluation/weights.cpp \
            ai/evaluation/trigger_route.cpp \
            ai/evaluation/virtual_chain_potential.cpp \
            ai/evaluation/long_chain_potential.cpp \
            ai/evaluation/main_chain.cpp \
            ai/evaluation/forms.cpp \
            ai/evaluation/debug_log.cpp \
            ai/evaluation/survival_horizon.cpp \
            -I. \
            -o chain_benchmark_test

          ./chain_benchmark_test

      - name: Survival-horizon regression test
        run: |
          g++ \
            -std=c++20 \
            -O2 \
            tests/test_survival_horizon.cpp \
            ai/evaluation/survival_horizon.cpp \
            ai/search/move_generator.cpp \
            ai/simulation/board.cpp \
            ai/simulation/simulator.cpp \
            -I. \
            -o survival_horizon_test

          ./survival_horizon_test

      - name: Build WASM
        run: |
          em++ \
            wasm/puyoAI.cpp \
            ai/benchmark/chain_benchmark.cpp \
            ai/ai.cpp \
            ai/gtr/gtr_ai.cpp \
            ai/search/move_generator.cpp \
            ai/search/beam_search.cpp \
            ai/simulation/board.cpp \
            ai/simulation/simulator.cpp \
            ai/evaluation/features.cpp \
            ai/evaluation/evaluation.cpp \
            ai/evaluation/weights.cpp \
            ai/evaluation/trigger_route.cpp \
            ai/evaluation/virtual_chain_potential.cpp \
            ai/evaluation/long_chain_potential.cpp \
            ai/evaluation/main_chain.cpp \
            ai/evaluation/forms.cpp \
            ai/evaluation/debug_log.cpp \
            ai/evaluation/survival_horizon.cpp \
            -std=c++20 \
            -O3 \
            -flto \
            -I. \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=worker \
            -sALLOW_MEMORY_GROWTH=1 \
            -sEXPORTED_FUNCTIONS='["_malloc","_free","_reset_ai","_set_board_cell","_ai_choose_move","_get_ai_pattern_name","_set_ai_debug_logging","_get_ai_debug_log","_run_chain_benchmark","_reset_ai_weights","_get_ai_weight_count","_get_ai_weight_name","_get_ai_weight","_set_ai_weight"]' \
            -sEXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o puyoAI_wasm.mjs

      - name: Verify WASM output
        run: |
          test -f puyoAI_wasm.mjs
          test -f puyoAI_wasm.wasm
          ls -lh puyoAI_wasm.mjs puyoAI_wasm.wasm

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='tools/' \
            --exclude='build/' \
            --exclude='_site/' \
            --exclude='native_test' \
            --exclude='trigger_structure_test' \
            --exclude='long_chain_potential_test' \
            --exclude='virtual_chain_potential_test' \
            --exclude='weight_api_test' \
            --exclude='debug_log_test' \
            --exclude='main_chain_test' \
            --exclude='chain_benchmark_test' \
            --exclude='survival_horizon_test' \
            --exclude='puyoai_test' \
            --exclude='puyoai_construction_test' \
            --exclude='puyoai_virtual_test' \
            --exclude='puyoai_benchmark_test' \
            ./ _site/

          cp puyoAI_wasm.mjs _site/puyoAI_wasm.mjs
          cp puyoAI_wasm.wasm _site/puyoAI_wasm.wasm

          echo "=== Pages artifact ==="
          find _site -maxdepth 3 -type f | sort

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
